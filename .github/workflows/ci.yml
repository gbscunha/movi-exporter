name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt pytest ruff
      - name: 🧪 pytest
        run: pytest -q
      - name: 🧹 ruff
        run: ruff check src/
