# GitHub Actions Workflow para Build Automático
# Gera executáveis para Windows e macOS a cada release

name: Build & Release

on:
  push:
    tags:
      - "v*" # Executa em tags como v1.0.0, v1.2.3, etc.
  workflow_dispatch: # Permite execução manual

permissions:
  contents: write # Necessário para criar releases

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: MoviExporter.exe
            asset_name: MoviExporter-Windows.exe
          - os: macos-latest
            artifact_name: MoviExporter.app
            asset_name: MoviExporter-macOS.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Use 3.12 para compatibilidade máxima
          cache: "pip"

      - name: 🔢 Validar versão (tag = __version__)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          APP_VER=$(python -c "import sys; sys.path.insert(0, '.'); from src.gui import __version__; print(__version__)")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$APP_VER" != "$TAG_VER" ]; then
            echo "ERRO: __version__=$APP_VER mas tag=$TAG_VER"
            exit 1
          fi
          echo "OK: versão $APP_VER bate com a tag"

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🔨 Build com PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller movi_exporter.spec --clean --noconfirm
          dir dist

      - name: 🔨 Build com PyInstaller (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller movi_exporter.spec --clean --noconfirm
          # Criar ZIP do .app
          cd dist
          zip -r MoviExporter-macOS.zip MoviExporter.app
          ls -la

      - name: 📤 Upload Artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/MoviExporter.exe
          retention-days: 7

      - name: 📤 Upload Artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/MoviExporter-macOS.zip
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📥 Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows

      - name: 📥 Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/macos

      - name: 📋 Listar arquivos
        run: |
          echo "Windows:"
          ls -la artifacts/windows/
          echo "macOS:"
          ls -la artifacts/macos/

      - name: 🚀 Criar Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows/MoviExporter.exe
            artifacts/macos/MoviExporter-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
